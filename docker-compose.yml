services:
  db:
    container_name: roshambo_db
    image: postgres:18.2-alpine3.23
    ports:
      - ${DB_PORT}:5432
    environment:
      POSTGRES_DB: roshambo
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/data/postgres
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db: